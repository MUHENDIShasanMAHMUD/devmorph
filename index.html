  <script>
    let currentMode = 'json2ts';
    const inputEl = document.getElementById('input');
    const outputEl = document.getElementById('output');
    const statsEl = document.getElementById('input-stats');
    const errorBar = document.getElementById('error-bar');
    const errorMsg = document.getElementById('error-msg');
    const inputContainer = document.getElementById('input-container');

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('bg-brand-600', 'text-white');
        btn.classList.add('text-gray-400', 'hover:text-white', 'hover:bg-gray-800');
      });
      const activeBtn = document.getElementById(`btn-${mode}`);
      if (activeBtn) {
        activeBtn.classList.remove('text-gray-400', 'hover:text-white', 'hover:bg-gray-800');
        activeBtn.classList.add('bg-brand-600', 'text-white');
      }
      hideError();
      handleConvert();
    }

    function clearAll() {
      inputEl.value = '';
      outputEl.value = '';
      updateStats();
      hideError();
    }

    function updateStats() {
      statsEl.innerText = `${inputEl.value.length} chars`;
    }

    function showError(msg) {
      errorMsg.innerText = msg;
      errorBar.classList.remove('hidden');
      outputEl.value = '';
    }

    function hideError() {
      errorBar.classList.add('hidden');
    }

    function copyOutput() {
      if (!outputEl.value) return;
      navigator.clipboard.writeText(outputEl.value);
      const btn = document.getElementById('copy-btn');
      btn.innerHTML = `<i data-lucide="check" class="w-3.5 h-3.5 text-emerald-400"></i> Copied!`;
      lucide.createIcons();
      setTimeout(() => {
        btn.innerHTML = `<i data-lucide="copy" class="w-3.5 h-3.5"></i> Copy Code`;
        lucide.createIcons();
      }, 2000);
    }

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      readFileContent(file);
      event.target.value = '';
    }

    function readFileContent(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        inputEl.value = e.target.result;
        handleConvert();
      };
      reader.onerror = () => {
        showError("Failed to read file");
      };
      reader.readAsText(file);
    }

    ['dragenter', 'dragover'].forEach(name => {
      inputContainer.addEventListener(name, (e) => {
        e.preventDefault();
        inputContainer.classList.add('drag-over');
      });
    });

    ['dragleave', 'drop'].forEach(name => {
      inputContainer.addEventListener(name, (e) => {
        e.preventDefault();
        inputContainer.classList.remove('drag-over');
      });
    });

    inputContainer.addEventListener('drop', (e) => {
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        readFileContent(files[0]);
      }
    });

    function downloadOutputFile() {
      const content = outputEl.value;
      if (!content) return;

      let filename = "devmorph_output.txt";
      let mimeType = "text/plain";

      switch (currentMode) {
        case 'json2ts':
          filename = "types.ts";
          mimeType = "application/typescript";
          break;
        case 'json2go':
          filename = "models.go";
          mimeType = "text/plain";
          break;
        case 'curl2fetch':
          filename = "api_request.js";
          mimeType = "application/javascript";
          break;
        case 'jwt':
          filename = "jwt_decoded.json";
          mimeType = "application/json";
          break;
        case 'minify':
          filename = "data.min.json";
          mimeType = "application/json";
          break;
      }

      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function loadSample() {
      if (currentMode.startsWith('json') || currentMode === 'minify') {
        inputEl.value = JSON.stringify({
          project: "DevMorph",
          active: true,
          metrics: { latency_ms: 12.4, requests: 1040 },
          modules: [
            { id: 1, name: "core_engine" }
          ]
        }, null, 2);
      } else if (currentMode === 'curl2fetch') {
        inputEl.value = `curl -X POST "https://api.myserver.com/devices" \\
  -H "Authorization: Bearer token_abc_123" \\
  -H "Content-Type: application/json" \\
  -d '{"device": "ESP32", "status": "active"}'`;
      } else if (currentMode === 'jwt') {
        inputEl.value = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTYiLCJ1c2VyIjoiSGFzYW4iLCJyb2xlIjoiRW5naW5lZXIifQ.mockSignatureValue';
      }
      handleConvert();
    }

    function handleConvert() {
      updateStats();
      hideError();
      const raw = inputEl.value.trim();

      if (!raw) {
        outputEl.value = '';
        return;
      }

      try {
        switch (currentMode) {
          case 'json2ts':
            outputEl.value = convertJsonToTs(JSON.parse(raw));
            break;
          case 'json2go':
            outputEl.value = convertJsonToGo(JSON.parse(raw));
            break;
          case 'curl2fetch':
            outputEl.value = convertCurlToFetch(raw);
            break;
          case 'jwt':
            outputEl.value = decodeJwt(raw);
            break;
          case 'minify':
            const obj = JSON.parse(raw);
            outputEl.value = raw.includes('\n') ? JSON.stringify(obj) : JSON.stringify(obj, null, 2);
            break;
        }
      } catch (e) {
        showError(e.message);
      }
    }

    function convertJsonToTs(obj, interfaceName = "RootObject") {
      let interfaces = [];
      function generate(target, name) {
        let result = `export interface ${name} {\n`;
        for (const [key, value] of Object.entries(target)) {
          let type = typeof value;
          if (value === null) type = 'any';
          else if (Array.isArray(value)) {
            if (value.length > 0 && typeof value[0] === 'object') {
              const subName = capitalize(key) + 'Item';
              generate(value[0], subName);
              type = `${subName}[]`;
            } else {
              type = value.length > 0 ? `${typeof value[0]}[]` : 'any[]';
            }
          } else if (type === 'object') {
            const subName = capitalize(key);
            generate(value, subName);
            type = subName;
          }
          result += `  ${key}: ${type};\n`;
        }
        result += `}\n`;
        interfaces.push(result);
      }
      generate(obj, interfaceName);
      return interfaces.reverse().join('\n');
    }

    function convertJsonToGo(obj, structName = "Model") {
      let structs = [];
      function generate(target, name) {
        let result = `type ${name} struct {\n`;
        for (const [key, value] of Object.entries(target)) {
          let fieldName = capitalize(key);
          let type = "string";
          if (typeof value === "number") type = Number.isInteger(value) ? "int" : "float64";
          else if (typeof value === "boolean") type = "bool";
          else if (Array.isArray(value)) {
            if (value.length > 0 && typeof value[0] === 'object') {
              const sub = capitalize(key) + 'Item';
              generate(value[0], sub);
              type = `[]${sub}`;
            } else {
              type = value.length > 0 ? `[]${typeof value[0]}` : '[]interface{}';
            }
          } else if (value && typeof value === "object") {
            const sub = capitalize(key);
            generate(value, sub);
            type = sub;
          }
          result += `\t${fieldName} ${type} \`json:"${key}"\`\n`;
        }
        result += `}\n`;
        structs.push(result);
      }
      generate(obj, structName);
      return structs.reverse().join('\n');
    }

    function convertCurlToFetch(curl) {
      if (!curl.toLowerCase().includes('curl')) {
        throw new Error("Input must be a valid cURL command");
      }
      const clean = curl.replace(/\\\r?\n/g, ' ');

      const urlMatch = clean.match(/https?:\/\/[^\s'"]+/);
      const url = urlMatch ? urlMatch[0] : 'https://api.example.com';

      const methodMatch = clean.match(/-X\s+([A-Z]+)/i);
      let method = methodMatch ? methodMatch[1].toUpperCase() : null;
      if (!method) {
        method = (clean.includes('-d ') || clean.includes('--data')) ? 'POST' : 'GET';
      }

      const headers = {};
      const headerMatches = clean.matchAll(/-H\s+['"]([^'"]+)['"]/g);
      for (const m of headerMatches) {
        const parts = m[1].split(':');
        if (parts.length >= 2) {
          headers[parts[0].trim()] = parts.slice(1).join(':').trim();
        }
      }

      const bodyMatch = clean.match(/(?:-d|--data(?:-raw)?)\s+['"]([\s\S]*?)['"](?:\s+-[A-Za-z]|$)/);
      let body = bodyMatch ? bodyMatch[1] : null;

      let code = `const response = await fetch("${url}", {\n`;
      code += `  method: "${method}",\n`;
      if (Object.keys(headers).length > 0) {
        code += `  headers: ${JSON.stringify(headers, null, 4).replace(/\n/g, '\n  ')},\n`;
      }
      if (body && method !== 'GET') {
        try {
          const parsed = JSON.parse(body);
          code += `  body: JSON.stringify(${JSON.stringify(parsed, null, 4).replace(/\n/g, '  ')})\n`;
        } catch {
          code += `  body: ${JSON.stringify(body)}\n`;
        }
      }
      code += `});\n\nconst data = await response.json();`;
      return code;
    }

    function decodeJwt(token) {
      const parts = token.trim().split('.');
      if (parts.length < 2) {
        throw new Error("Invalid JWT format: Token must have header and payload separated by dots");
      }
      const decode = (str) => {
        try {
          const base64 = str.replace(/-/g, '+').replace(/_/g, '/');
          const decodedStr = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
          return JSON.parse(decodedStr);
        } catch (e) {
          throw new Error("Malformed JWT payload: invalid base64 encoding");
        }
      };

      const header = decode(parts[0]);
      const payload = decode(parts[1]);
      const signatureInfo = parts[2] ? `// Signature Verified: [${parts[2].slice(0, 10)}...]` : '// Signature: None';

      return `// Header\n${JSON.stringify(header, null, 2)}\n\n// Payload\n${JSON.stringify(payload, null, 2)}\n\n${signatureInfo}`;
    }

    function capitalize(s) {
      return s.charAt(0).toUpperCase() + s.slice(1);
    }

    ['input', 'keyup', 'paste', 'change'].forEach(evt => {
      inputEl.addEventListener(evt, handleConvert);
    });

    lucide.createIcons();
    loadSample();
  </script>
