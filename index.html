<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- High-Res Custom Favicon (Terminal/Code Symbol) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f172a' stroke='%234f46e5' stroke-width='2'/%3E%3Cpath d='M9 11l5 5-5 5' stroke='%236366f1' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Cline x1='16' y1='21' x2='23' y2='21' stroke='%2338bdf8' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">

  <!-- SEO & Social Meta Tags -->
  <title>DevMorph | Modern Developer Utility Hub by Hasan Mahmud</title>
  <meta name="description" content="Fast, 100% offline and private developer utility suite: JSON to TypeScript/Go, cURL to Fetch, JWT Decoder, Minifier. Developed by Eng. Hasan Mahmud.">
  <meta name="keywords" content="JSON to TypeScript, JSON to Go, cURL to Fetch, JWT Decoder, Developer Tools, Hasan Mahmud, Hasan TechLab">
  <meta name="author" content="Eng. Hasan Mahmud">
  <link rel="canonical" href="https://tools.hasantechlab.com">

  <!-- Open Graph / Social Media Sharing -->
  <meta property="og:title" content="DevMorph | Developer Utility Suite by Eng. Hasan Mahmud">
  <meta property="og:description" content="Instant, client-side utility suite for developers. 100% private and offline.">
  <meta property="og:url" content="https://tools.hasantechlab.com">
  <meta property="og:type" content="website">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#6366f1', 600: '#4f46e5' },
            dark: { 900: '#0b0f19', 800: '#111827', 700: '#1f2937' }
          }
        }
      }
    }
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    html { background: #0b0f19; }
    body { overflow-x: hidden; }
    :root {
      color-scheme: dark;
      --app-bg: #0b0f19;
      --surface: #111827;
      --surface-raised: #172033;
      --line: rgba(148, 163, 184, 0.14);
      --muted: #94a3b8;
    }
    html[data-theme="light"] {
      color-scheme: light;
      --app-bg: #f4f7fb;
      --surface: #ffffff;
      --surface-raised: #f8fafc;
      --line: #dbe3ee;
      --muted: #64748b;
    }
    body { background: var(--app-bg) !important; }
    .bg-dark-800 { background-color: var(--surface) !important; }
    .bg-dark-900 { background-color: var(--app-bg) !important; }
    .border-gray-800 { border-color: var(--line) !important; }
    .bg-\[\#0d121f\] { background-color: var(--surface-raised) !important; }
    html[data-theme="light"] .text-gray-200 { color: #1e293b !important; }
    html[data-theme="light"] .text-gray-300,
    html[data-theme="light"] .text-gray-400 { color: #475569 !important; }
    html[data-theme="light"] .text-gray-500,
    html[data-theme="light"] .text-gray-600 { color: #64748b !important; }
    html[data-theme="light"] .text-gray-700 { color: #334155 !important; }
    html[data-theme="light"] .text-white { color: #0f172a !important; }
    html[data-theme="light"] .bg-brand-600.text-white,
    html[data-theme="light"] .bg-brand-600 .text-white { color: #ffffff !important; }
    html[data-theme="light"] .bg-gray-800,
    html[data-theme="light"] .bg-gray-800\/80 { background-color: #f1f5f9 !important; }
    html[data-theme="light"] .bg-dark-800\/60,
    html[data-theme="light"] .bg-dark-800\/80 { background-color: rgba(255, 255, 255, 0.88) !important; }
    html[data-theme="light"] .hover\:bg-gray-800:hover,
    html[data-theme="light"] .hover\:bg-gray-700:hover { background-color: #e2e8f0 !important; }
    html[data-theme="light"] .border-gray-700 { border-color: #cbd5e1 !important; }
    html[data-theme="light"] textarea { color: #1e293b !important; }
    html[data-theme="light"] textarea::placeholder { color: #94a3b8 !important; }
    html[data-theme="light"] .conversion-toolbar,
    html[data-theme="light"] .history-panel { background: #ffffff; box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08); }
    html[data-theme="light"] .history-item { background: #f8fafc; }
    .theme-button { border: 1px solid var(--line); background: rgba(30, 41, 59, 0.56); }
    .theme-button:hover { background: rgba(51, 65, 85, 0.78); }
    .history-panel { border-color: var(--line); background: linear-gradient(135deg, rgba(17, 24, 39, 0.98), rgba(15, 23, 42, 0.94)); }
    .history-item { border: 1px solid var(--line); background: rgba(15, 23, 42, 0.58); }
    .history-item:hover { border-color: rgba(99, 102, 241, 0.42); background: rgba(30, 41, 59, 0.72); }
    .tool-count { color: var(--muted); }
    .conversion-toolbar {
      background: linear-gradient(180deg, rgba(17, 24, 39, 0.96), rgba(15, 23, 42, 0.92));
      box-shadow: 0 10px 24px rgba(2, 6, 23, 0.16);
    }
    .conversion-modes,
    .conversion-actions { display: flex; align-items: center; }
    .conversion-modes { min-width: 0; }
    .modes-shell { min-width: 0; }
    .mode-scroll-button { display: none; }
    .conversion-modes .tab-btn {
      border: 1px solid transparent;
      min-height: 2.25rem;
      white-space: nowrap;
    }
    .conversion-modes .tab-btn:hover { border-color: rgba(99, 102, 241, 0.24); }
    .conversion-actions button { min-height: 2.25rem; white-space: nowrap; }
    textarea::-webkit-scrollbar { width: 6px; height: 6px; }
    textarea::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    .drag-over { border-color: #6366f1 !important; background-color: rgba(99, 102, 241, 0.05) !important; }

    @media (max-width: 767px) {
      header .max-w-7xl { min-height: 4.5rem; }
      main { padding-top: 1rem; padding-bottom: 1rem; }
      .conversion-toolbar { align-items: stretch; padding: 0.5rem; gap: 0.5rem; }
      .modes-shell {
        position: relative;
        width: 100%;
        min-width: 0;
      }
      .conversion-modes {
        width: 100%;
        overflow-x: auto;
        flex-wrap: nowrap;
        padding: 0 2rem 0.15rem;
        scroll-behavior: smooth;
        scrollbar-width: none;
      }
      .conversion-modes::-webkit-scrollbar { display: none; }
      .mode-scroll-button {
        display: flex;
        align-items: center;
        justify-content: center;
        position: absolute;
        top: 0.25rem;
        z-index: 2;
        width: 2rem;
        height: 2rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        background: color-mix(in srgb, var(--surface) 90%, transparent);
        box-shadow: 0 3px 10px rgba(2, 6, 23, 0.18);
      }
      .mode-scroll-button:hover { color: #ffffff; background: #4f46e5; }
      .mode-scroll-left { left: 0.15rem; }
      .mode-scroll-right { right: 0.15rem; }
      .conversion-modes .tab-btn {
        flex: 0 0 auto;
        min-height: 2.5rem;
        white-space: nowrap;
      }
      .conversion-actions { width: 100%; }
      .conversion-actions button {
        flex: 1 1 0;
        justify-content: center;
        min-height: 2.5rem;
        white-space: nowrap;
      }
      #input-container,
      #input-container + div { min-height: 20rem; }
      #input,
      #output { min-height: 15rem; }
      footer { padding-bottom: 1rem; }
      footer > div { padding: 0.75rem; }
    }
  </style>
</head>
<body class="bg-dark-900 text-gray-200 min-h-screen flex flex-col font-sans antialiased selection:bg-brand-500 selection:text-white">

  <!-- Header -->
  <header class="border-b border-gray-800 bg-dark-800/60 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-brand-500/10 text-brand-500 rounded-lg border border-brand-500/20">
          <i data-lucide="terminal" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg text-white tracking-wide">DevMorph</h1>
          <p class="text-xs text-gray-400">Client-Side Developer Utility Suite</p>
        </div>
      </div>
      
      <div class="flex items-center gap-3">
        <span class="hidden sm:flex text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2.5 py-1 rounded-full font-mono items-center gap-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> 100% Offline & Private
        </span>
        <button id="theme-toggle" onclick="toggleTheme()" class="theme-button text-xs text-gray-300 hover:text-white px-2.5 py-1.5 rounded-lg transition flex items-center gap-1.5" aria-label="Toggle dark theme">
          <i data-lucide="moon" class="w-3.5 h-3.5"></i><span class="hidden sm:inline">Theme</span>
        </button>
        <button onclick="toggleHistory()" class="theme-button text-xs text-gray-300 hover:text-white px-2.5 py-1.5 rounded-lg transition flex items-center gap-1.5" aria-label="Open session history">
          <i data-lucide="history" class="w-3.5 h-3.5"></i><span class="hidden sm:inline">History</span>
        </button>
        <a href="https://hasantechlab.com" target="_blank" rel="noopener noreferrer" 
           class="text-xs text-gray-300 hover:text-white bg-gray-800 hover:bg-gray-700 border border-gray-700 px-3 py-1.5 rounded-lg transition flex items-center gap-1.5">
          <i data-lucide="globe" class="w-3.5 h-3.5 text-brand-500"></i> Main Site
        </a>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 flex-1 flex flex-col w-full gap-4">
    
    <!-- Controls Bar -->
    <div class="conversion-toolbar flex flex-wrap items-center justify-between gap-3 p-2.5 rounded-xl border border-gray-800">
      <div class="modes-shell">
        <button class="mode-scroll-button mode-scroll-left" onclick="scrollTools(-1)" aria-label="Scroll tools left" title="Scroll tools left">
          <i data-lucide="chevron-left" class="w-4 h-4"></i>
        </button>
        <div class="conversion-modes gap-1.5 overflow-x-auto" aria-label="Conversion tools">
        <button onclick="setMode('json2ts')" id="btn-json2ts" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium transition bg-brand-600 text-white">
          JSON <span class="text-brand-200">→</span> TypeScript
        </button>
        <button onclick="setMode('json2go')" id="btn-json2go" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium transition text-gray-400 hover:text-white hover:bg-gray-800">
          JSON <span class="text-gray-500">→</span> Go
        </button>
        <button onclick="setMode('curl2fetch')" id="btn-curl2fetch" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium transition text-gray-400 hover:text-white hover:bg-gray-800">
          cURL <span class="text-gray-500">→</span> Fetch
        </button>
        <button onclick="setMode('jwt')" id="btn-jwt" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium transition text-gray-400 hover:text-white hover:bg-gray-800">
          JWT Decode
        </button>
        <button onclick="setMode('minify')" id="btn-minify" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium transition text-gray-400 hover:text-white hover:bg-gray-800">
          JSON Format
        </button>
        <button onclick="setMode('cron')" id="btn-cron" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium transition text-gray-400 hover:text-white hover:bg-gray-800">
          Cron Check
        </button>
        <button onclick="setMode('regex')" id="btn-regex" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium transition text-gray-400 hover:text-white hover:bg-gray-800">
          Regex Test
        </button>
        <button onclick="setMode('regexgen')" id="btn-regexgen" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium transition text-gray-400 hover:text-white hover:bg-gray-800">
          Regex Gen
        </button>
        <button onclick="setMode('base64')" id="btn-base64" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium transition text-gray-400 hover:text-white hover:bg-gray-800">
          Base64
        </button>
        </div>
        <button class="mode-scroll-button mode-scroll-right" onclick="scrollTools(1)" aria-label="Scroll tools right" title="Scroll tools right">
          <i data-lucide="chevron-right" class="w-4 h-4"></i>
        </button>
      </div>

      <div class="conversion-actions gap-2">
        <button onclick="handleConvert()" class="text-xs text-white bg-brand-600 hover:bg-brand-500 px-3 py-1.5 rounded-lg font-medium shadow-sm transition flex items-center gap-1.5">
          <i data-lucide="play" class="w-3.5 h-3.5 fill-current"></i> Convert Now
        </button>
        <button onclick="loadSample()" class="text-xs text-gray-300 hover:text-white px-2.5 py-1.5 rounded-lg border border-gray-700 bg-gray-800/80 hover:bg-gray-700 transition flex items-center gap-1.5">
          <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> Load Sample
        </button>
        <button onclick="clearAll()" class="text-xs text-rose-400 hover:text-rose-300 px-2.5 py-1.5 rounded-lg border border-rose-900/40 bg-rose-950/20 hover:bg-rose-900/30 transition flex items-center gap-1.5">
          <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Clear
        </button>
      </div>
    </div>

    <section id="history-panel" class="history-panel hidden rounded-xl border p-4 shadow-lg" aria-label="Recent session activity">
      <div class="flex items-center justify-between gap-3 mb-3">
        <div>
          <h2 class="text-sm font-semibold text-white flex items-center gap-2"><i data-lucide="history" class="w-4 h-4 text-brand-400"></i> Recent session</h2>
          <p class="text-xs text-gray-500 mt-1">Your latest local conversions stay on this device.</p>
        </div>
        <button onclick="clearHistory()" class="text-xs text-gray-400 hover:text-rose-300 px-2 py-1 rounded border border-gray-700 transition">Clear history</button>
      </div>
      <div id="history-list" class="grid gap-2"></div>
    </section>

    <!-- Editor Panels Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 flex-1">
      
      <!-- Input Panel -->
      <div id="input-container" class="bg-dark-800 border border-gray-800 rounded-xl flex flex-col overflow-hidden transition duration-150">
        <div class="px-4 py-2.5 border-b border-gray-800 bg-dark-800/80 flex items-center justify-between text-xs text-gray-400 font-mono">
          <span class="flex items-center gap-2 font-medium text-gray-300">
            <i data-lucide="file-input" class="w-4 h-4 text-brand-500"></i> Input (Type, Paste, or Drop File)
          </span>
          <div class="flex items-center gap-3">
            <span id="input-stats">0 chars</span>
            <!-- Upload Button -->
            <label class="cursor-pointer text-gray-300 hover:text-white bg-gray-700/60 hover:bg-gray-700 px-2 py-1 rounded transition flex items-center gap-1">
              <i data-lucide="upload" class="w-3.5 h-3.5"></i> Upload
              <input type="file" id="file-uploader" class="hidden" onchange="handleFileUpload(event)">
            </label>
          </div>
        </div>
        <textarea id="input" 
          placeholder="Paste, type, or drag & drop a file here..." 
          class="flex-1 w-full bg-transparent p-4 font-mono text-sm text-gray-200 outline-none resize-none placeholder-gray-600 focus:ring-1 focus:ring-brand-500"></textarea>
      </div>

      <!-- Output Panel -->
      <div class="bg-dark-800 border border-gray-800 rounded-xl flex flex-col overflow-hidden relative">
        <div class="px-4 py-2.5 border-b border-gray-800 bg-dark-800/80 flex items-center justify-between text-xs text-gray-400 font-mono">
          <span class="flex items-center gap-2 font-medium text-gray-300">
            <i data-lucide="file-output" class="w-4 h-4 text-emerald-400"></i> Output
          </span>
          <div class="flex items-center gap-2">
            <!-- Download Button -->
            <button onclick="downloadOutputFile()" class="text-xs text-gray-300 hover:text-white bg-gray-700/60 hover:bg-gray-700 px-2.5 py-1 rounded transition flex items-center gap-1.5">
              <i data-lucide="download" class="w-3.5 h-3.5"></i> Download
            </button>
            <!-- Copy Button -->
            <button id="copy-btn" onclick="copyOutput()" class="text-xs text-gray-300 hover:text-white bg-gray-700/60 hover:bg-gray-700 px-2.5 py-1 rounded transition flex items-center gap-1.5">
              <i data-lucide="copy" class="w-3.5 h-3.5"></i> Copy Code
            </button>
          </div>
        </div>
        <textarea id="output" readonly 
          placeholder="Result will appear here automatically..." 
          class="flex-1 w-full bg-[#0d121f] p-4 font-mono text-sm text-emerald-400 outline-none resize-none placeholder-gray-700 cursor-text"></textarea>
        
        <!-- Error Bar -->
        <div id="error-bar" class="hidden absolute bottom-3 left-3 right-3 bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs px-3 py-2 rounded-lg flex items-center gap-2 shadow-lg backdrop-blur">
          <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
          <span id="error-msg">Syntax Error</span>
        </div>
      </div>

    </div>

  </main>

<!-- Clean & Balanced Modern Footer -->
  <footer class="max-w-7xl mx-auto w-full px-4 sm:px-6 pb-6 pt-2">
    <div class="bg-dark-800/80 backdrop-blur-md border border-gray-800 rounded-2xl px-5 py-3 flex flex-col md:flex-row items-center justify-between gap-4 shadow-xl">
      
      <!-- Minimalist Tech Identity -->
      <div class="flex items-center gap-3">
        <div class="p-1.5 rounded-lg bg-brand-500/10 border border-brand-500/20 text-brand-400">
          <i data-lucide="code-2" class="w-4 h-4"></i>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-sm font-medium text-white tracking-wide">Eng. Hasan Mahmud</span>
          <span class="text-gray-600 font-mono text-xs">/</span>
          <span class="text-xs text-brand-400 font-mono">Hasan TechLab</span>
        </div>
      </div>

      <!-- Unified Action & Social Dock with Persistent True Brand Colors -->
      <div class="flex flex-wrap items-center justify-center gap-2 font-mono">
        
        <!-- Portfolio -->
        <a href="https://hasantechlab.com" target="_blank" rel="noopener noreferrer" 
           class="text-xs px-3 py-1.5 rounded-xl bg-dark-900 border border-gray-800 text-gray-300 hover:text-white hover:border-brand-500/50 hover:bg-gray-850 transition-all flex items-center gap-2 shadow-sm">
          <svg class="w-3.5 h-3.5 text-brand-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

          <span class="font-sans">Portfolio</span>

          <span class="font-sans">LinkedIn</span>
        </a>

        <!-- YouTube (Static Clean Red Icon) -->
        <a href="https://youtube.com/@hasantechlab" target="_blank" rel="noopener noreferrer"

            <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"></path>

        <!-- Contact (Static Clean Amber Icon) -->
        <a href="mailto:contact@hasantechlab.com" 
           class="text-xs px-3 py-1.5 rounded-xl bg-dark-900 border border-gray-800 text-gray-300 hover:text-white hover:border-amber-500/60 hover:bg-gray-850 transition-all flex items-center gap-2 shadow-sm">
          <svg class="w-3.5 h-3.5 text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="16" x="2" y="4" rx="2"></rect>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
          </svg>
          <span class="font-sans">Contact</span>
        </a>

      </div>

    </div>
  </footer>

  <script>
    let currentMode = 'json2ts';
    const inputEl = document.getElementById('input');
    const outputEl = document.getElementById('output');
    const statsEl = document.getElementById('input-stats');
    const errorBar = document.getElementById('error-bar');
    const errorMsg = document.getElementById('error-msg');
    const inputContainer = document.getElementById('input-container');
    const historyPanel = document.getElementById('history-panel');
    const historyList = document.getElementById('history-list');
    const historyKey = 'devmorph-session-history';
    const themeKey = 'devmorph-theme';
    let historyTimer;

    const modeLabels = {
      json2ts: 'JSON to TypeScript',
      json2go: 'JSON to Go',
      curl2fetch: 'cURL to Fetch',
      jwt: 'JWT Decoder',
      minify: 'JSON Formatter',
      cron: 'Cron Expression',
      regex: 'Regex Tester',
      regexgen: 'Regex Generator',
      base64: 'Base64 Encoder'
    };

    function toggleTheme() {
      const html = document.documentElement;
      const nextTheme = html.dataset.theme === 'light' ? 'dark' : 'light';
      html.dataset.theme = nextTheme;
      localStorage.setItem(themeKey, nextTheme);
      const themeButton = document.getElementById('theme-toggle');
      themeButton.setAttribute('aria-label', `Switch to ${nextTheme === 'light' ? 'dark' : 'light'} theme`);
    }

    function applySavedTheme() {
      const savedTheme = localStorage.getItem(themeKey);
      const theme = savedTheme === 'light' ? 'light' : 'dark';
      document.documentElement.dataset.theme = theme;
      document.getElementById('theme-toggle').setAttribute('aria-label', `Switch to ${theme === 'light' ? 'dark' : 'light'} theme`);
    }

    function toggleHistory() {
      historyPanel.classList.toggle('hidden');
      renderHistory();
    }

    function scrollTools(direction) {
      document.querySelector('.conversion-modes').scrollBy({ left: direction * 220, behavior: 'smooth' });
    }

    function getHistory() {
      try {
        return JSON.parse(localStorage.getItem(historyKey) || '[]');
      } catch {
        return [];
      }
    }

    function saveHistory(items) {
      localStorage.setItem(historyKey, JSON.stringify(items.slice(0, 8)));
    }

    function recordHistory() {
      const raw = inputEl.value.trim();
      if (!raw || !outputEl.value) return;
      const item = { mode: currentMode, preview: raw.slice(0, 72), time: Date.now() };
      const history = getHistory().filter(entry => !(entry.mode === item.mode && entry.preview === item.preview));
      saveHistory([item, ...history]);
      renderHistory();
    }

    function renderHistory() {
      if (!historyList) return;
      const history = getHistory();
      if (!history.length) {
        historyList.innerHTML = '<p class="text-xs text-gray-500 py-2">No activity in this session yet.</p>';
        return;
      }
      historyList.innerHTML = history.map(item => `
        <button class="history-item text-left rounded-lg px-3 py-2 transition" onclick="restoreHistory(${item.time})">
          <span class="block text-xs font-medium text-gray-200">${modeLabels[item.mode] || item.mode}</span>
          <span class="block text-xs text-gray-500 truncate mt-1">${escapeHtml(item.preview)}</span>
        </button>
      `).join('');
    }

    function escapeHtml(value) {
      return value.replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char]));
    }

    function restoreHistory(timestamp) {
      const item = getHistory().find(entry => entry.time === timestamp);
      if (!item) return;
      setMode(item.mode);
      inputEl.value = item.preview;
      handleConvert();
      historyPanel.classList.add('hidden');
    }

    function clearHistory() {
      localStorage.removeItem(historyKey);
      renderHistory();
    }

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('bg-brand-600', 'text-white');
        btn.classList.add('text-gray-400', 'hover:text-white', 'hover:bg-gray-800');
      });
      const activeBtn = document.getElementById(`btn-${mode}`);
      if (activeBtn) {
        activeBtn.classList.remove('text-gray-400', 'hover:text-white', 'hover:bg-gray-800');
        activeBtn.classList.add('bg-brand-600', 'text-white');
      }
      hideError();
      handleConvert();
    }

    function clearAll() {
      inputEl.value = '';
      outputEl.value = '';
      updateStats();
      hideError();
    }

    function updateStats() {
      statsEl.innerText = `${inputEl.value.length} chars`;
    }

    function showError(msg) {
      errorMsg.innerText = msg;
      errorBar.classList.remove('hidden');
      outputEl.value = '';
    }

    function hideError() {
      errorBar.classList.add('hidden');
    }

    function copyOutput() {
      if (!outputEl.value) return;
      navigator.clipboard.writeText(outputEl.value);
      const btn = document.getElementById('copy-btn');
      btn.innerHTML = `<i data-lucide="check" class="w-3.5 h-3.5 text-emerald-400"></i> Copied!`;
      lucide.createIcons();
      setTimeout(() => {
        btn.innerHTML = `<i data-lucide="copy" class="w-3.5 h-3.5"></i> Copy Code`;
        lucide.createIcons();
      }, 2000);
    }

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      readFileContent(file);
      event.target.value = '';
    }

    function readFileContent(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        inputEl.value = e.target.result;
        handleConvert();
      };
      reader.onerror = () => {
        showError("Failed to read file");
      };
      reader.readAsText(file);
    }

    ['dragenter', 'dragover'].forEach(name => {
      inputContainer.addEventListener(name, (e) => {
        e.preventDefault();
        inputContainer.classList.add('drag-over');
      });
    });

    ['dragleave', 'drop'].forEach(name => {
      inputContainer.addEventListener(name, (e) => {
        e.preventDefault();
        inputContainer.classList.remove('drag-over');
      });
    });

    inputContainer.addEventListener('drop', (e) => {
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        readFileContent(files[0]);
      }
    });

    function downloadOutputFile() {
      const content = outputEl.value;
      if (!content) return;

      let filename = "devmorph_output.txt";
      let mimeType = "text/plain";

      switch (currentMode) {
        case 'json2ts':
          filename = "types.ts";
          mimeType = "application/typescript";
          break;
        case 'json2go':
          filename = "models.go";
          mimeType = "text/plain";
          break;
        case 'curl2fetch':
          filename = "api_request.js";
          mimeType = "application/javascript";
          break;
        case 'jwt':
          filename = "jwt_decoded.json";
          mimeType = "application/json";
          break;
        case 'minify':
          filename = "data.min.json";
          mimeType = "application/json";
          break;
        case 'cron':
          filename = "cron-report.txt";
          break;
        case 'regex':
        case 'regexgen':
          filename = "regex-result.txt";
          break;
        case 'base64':
          filename = "base64.txt";
          break;
      }

      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function loadSample() {
      if (currentMode.startsWith('json') || currentMode === 'minify') {
        inputEl.value = JSON.stringify({
          project: "DevMorph",
          active: true,
          metrics: { latency_ms: 12.4, requests: 1040 },
          modules: [
            { id: 1, name: "core_engine" }
          ]
        }, null, 2);
      } else if (currentMode === 'curl2fetch') {
        inputEl.value = `curl -X POST "https://api.myserver.com/devices" \\
  -H "Authorization: Bearer token_abc_123" \\
  -H "Content-Type: application/json" \\
  -d '{"device": "ESP32", "status": "active"}'`;
      } else if (currentMode === 'jwt') {
        inputEl.value = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTYiLCJ1c2VyIjoiSGFzYW4iLCJyb2xlIjoiRW5naW5lZXIifQ.mockSignatureValue';
      } else if (currentMode === 'cron') {
        inputEl.value = '*/15 9-17 * * 1-5';
      } else if (currentMode === 'regex') {
        inputEl.value = '/^[\\w.+-]+@[\\w.-]+\\.[A-Za-z]{2,}$/gi\n---\nhello@example.com\ninvalid-email\nteam@devmorph.io';
      } else if (currentMode === 'regexgen') {
        inputEl.value = 'email';
      } else if (currentMode === 'base64') {
        inputEl.value = 'DevMorph keeps your data in the browser.';
      }
      handleConvert();
    }

    function handleConvert() {
      updateStats();
      hideError();
      const raw = inputEl.value.trim();

      if (!raw) {
        outputEl.value = '';
        return;
      }

      try {
        switch (currentMode) {
          case 'json2ts':
            outputEl.value = convertJsonToTs(JSON.parse(raw));
            break;
          case 'json2go':
            outputEl.value = convertJsonToGo(JSON.parse(raw));
            break;
          case 'curl2fetch':
            outputEl.value = convertCurlToFetch(raw);
            break;
          case 'jwt':
            outputEl.value = decodeJwt(raw);
            break;
          case 'minify':
            const obj = JSON.parse(raw);
            outputEl.value = raw.includes('\n') ? JSON.stringify(obj) : JSON.stringify(obj, null, 2);
            break;
          case 'cron':
            outputEl.value = testCronExpression(raw);
            break;
          case 'regex':
            outputEl.value = testRegex(raw);
            break;
          case 'regexgen':
            outputEl.value = generateRegex(raw);
            break;
          case 'base64':
            outputEl.value = encodeBase64(raw);
            break;
        }
        clearTimeout(historyTimer);
        historyTimer = setTimeout(recordHistory, 450);
      } catch (e) {
        showError(e.message);
      }
    }

    function convertJsonToTs(obj, interfaceName = "RootObject") {
      let interfaces = [];
      function generate(target, name) {
        let result = `export interface ${name} {\n`;
        for (const [key, value] of Object.entries(target)) {
          let type = typeof value;
          if (value === null) type = 'any';
          else if (Array.isArray(value)) {
            if (value.length > 0 && typeof value[0] === 'object') {
              const subName = capitalize(key) + 'Item';
              generate(value[0], subName);
              type = `${subName}[]`;
            } else {
              type = value.length > 0 ? `${typeof value[0]}[]` : 'any[]';
            }
          } else if (type === 'object') {
            const subName = capitalize(key);
            generate(value, subName);
            type = subName;
          }
          result += `  ${key}: ${type};\n`;
        }
        result += `}\n`;
        interfaces.push(result);
      }
      generate(obj, interfaceName);
      return interfaces.reverse().join('\n');
    }

    function convertJsonToGo(obj, structName = "Model") {
      let structs = [];
      function generate(target, name) {
        let result = `type ${name} struct {\n`;
        for (const [key, value] of Object.entries(target)) {
          let fieldName = capitalize(key);
          let type = "string";
          if (typeof value === "number") type = Number.isInteger(value) ? "int" : "float64";
          else if (typeof value === "boolean") type = "bool";
          else if (Array.isArray(value)) {
            if (value.length > 0 && typeof value[0] === 'object') {
              const sub = capitalize(key) + 'Item';
              generate(value[0], sub);
              type = `[]${sub}`;
            } else {
              type = value.length > 0 ? `[]${typeof value[0]}` : '[]interface{}';
            }
          } else if (value && typeof value === "object") {
            const sub = capitalize(key);
            generate(value, sub);
            type = sub;
          }
          result += `\t${fieldName} ${type} \`json:"${key}"\`\n`;
        }
        result += `}\n`;
        structs.push(result);
      }
      generate(obj, structName);
      return structs.reverse().join('\n');
    }

    function convertCurlToFetch(curl) {
      if (!curl.toLowerCase().includes('curl')) {
        throw new Error("Input must be a valid cURL command");
      }
      const clean = curl.replace(/\\\r?\n/g, ' ');

      const urlMatch = clean.match(/https?:\/\/[^\s'"]+/);
      const url = urlMatch ? urlMatch[0] : 'https://api.example.com';

      const methodMatch = clean.match(/-X\s+([A-Z]+)/i);
      let method = methodMatch ? methodMatch[1].toUpperCase() : null;
      if (!method) {
        method = (clean.includes('-d ') || clean.includes('--data')) ? 'POST' : 'GET';
      }

      const headers = {};
      const headerMatches = clean.matchAll(/-H\s+['"]([^'"]+)['"]/g);
      for (const m of headerMatches) {
        const parts = m[1].split(':');
        if (parts.length >= 2) {
          headers[parts[0].trim()] = parts.slice(1).join(':').trim();
        }
      }

      const bodyMatch = clean.match(/(?:-d|--data(?:-raw)?)\s+['"]([\s\S]*?)['"](?:\s+-[A-Za-z]|$)/);
      let body = bodyMatch ? bodyMatch[1] : null;

      let code = `const response = await fetch("${url}", {\n`;
      code += `  method: "${method}",\n`;
      if (Object.keys(headers).length > 0) {
        code += `  headers: ${JSON.stringify(headers, null, 4).replace(/\n/g, '\n  ')},\n`;
      }
      if (body && method !== 'GET') {
        try {
          const parsed = JSON.parse(body);
          code += `  body: JSON.stringify(${JSON.stringify(parsed, null, 4).replace(/\n/g, '  ')})\n`;
        } catch {
          code += `  body: ${JSON.stringify(body)}\n`;
        }
      }
      code += `});\n\nconst data = await response.json();`;
      return code;
    }

    function decodeJwt(token) {
      const parts = token.trim().split('.');
      if (parts.length < 2) {
        throw new Error("Invalid JWT format: Token must have header and payload separated by dots");
      }
      const decode = (str) => {
        try {
          const base64 = str.replace(/-/g, '+').replace(/_/g, '/');
          const decodedStr = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
          return JSON.parse(decodedStr);
        } catch (e) {
          throw new Error("Malformed JWT payload: invalid base64 encoding");
        }
      };

      const header = decode(parts[0]);
      const payload = decode(parts[1]);
      const signatureInfo = parts[2] ? `// Signature Verified: [${parts[2].slice(0, 10)}...]` : '// Signature: None';

      return `// Header\n${JSON.stringify(header, null, 2)}\n\n// Payload\n${JSON.stringify(payload, null, 2)}\n\n${signatureInfo}`;
    }

    function parseCronField(value, min, max) {
      const result = new Set();
      value.split(',').forEach(part => {
        const [rangePart, stepText] = part.split('/');
        const step = stepText ? Number(stepText) : 1;
        if (!Number.isInteger(step) || step < 1) throw new Error('Cron step must be a positive number');
        if (rangePart === '*') {
          for (let number = min; number <= max; number += step) result.add(number);
          return;
        }
        const range = rangePart.split('-').map(Number);
        if (range.length > 2 || range.some(number => !Number.isInteger(number))) throw new Error('Invalid cron range');
        const start = range[0];
        const end = range.length === 2 ? range[1] : start;
        if (start < min || end > max || start > end) throw new Error('Cron value is outside its valid range');
        for (let number = start; number <= end; number += step) result.add(number);
      });
      return result;
    }

    function testCronExpression(expression) {
      const fields = expression.trim().split(/\s+/);
      if (fields.length !== 5) throw new Error('Cron needs exactly 5 fields: minute hour day month weekday');
      const [minutes, hours, days, months, weekdays] = [
        parseCronField(fields[0], 0, 59),
        parseCronField(fields[1], 0, 23),
        parseCronField(fields[2], 1, 31),
        parseCronField(fields[3], 1, 12),
        parseCronField(fields[4].split(',').map(part => part === '7' ? '0' : part).join(','), 0, 6)
      ];
      const matches = [];
      const cursor = new Date();
      cursor.setSeconds(0, 0);
      const dayRestricted = fields[2] !== '*';
      const weekdayRestricted = fields[4] !== '*';
      for (let index = 0; index < 525600 && matches.length < 5; index++) {
        cursor.setMinutes(cursor.getMinutes() + 1);
        const dayMatch = days.has(cursor.getDate());
        const weekdayMatch = weekdays.has(cursor.getDay());
        const calendarMatch = dayRestricted && weekdayRestricted ? dayMatch || weekdayMatch : dayMatch && weekdayMatch;
        if (minutes.has(cursor.getMinutes()) && hours.has(cursor.getHours()) && months.has(cursor.getMonth() + 1) && calendarMatch) {
          matches.push(cursor.toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }));
        }
      }
      if (!matches.length) throw new Error('No upcoming run found within the next year');
      return `Valid cron expression\n\nNext runs\n${matches.map((run, index) => `${index + 1}. ${run}`).join('\n')}`;
    }

    function testRegex(value) {
      const separator = '\n---\n';
      const parts = value.split(separator);
      const definition = parts.shift().trim();
      const text = parts.join(separator);
      const literal = definition.match(/^\/(.*)\/([dgimsuvy]*)$/s);
      const pattern = literal ? literal[1] : definition;
      const flags = literal ? literal[2] : 'g';
      const regex = new RegExp(pattern, flags.includes('g') ? flags : `${flags}g`);
      const matches = [];
      text.split(/\r?\n/).forEach((line, lineIndex) => {
        regex.lastIndex = 0;
        for (const match of line.matchAll(regex)) {
          matches.push({ value: match[0], line: lineIndex + 1, groups: match.groups });
        }
      });
      if (!matches.length) return `No matches found\n\nPattern: /${pattern}/${flags}`;
      return `Matches: ${matches.length}\nPattern: /${pattern}/${flags}\n\n${matches.map((match, index) => `${index + 1}. ${match.value}${match.groups ? `\n   groups: ${JSON.stringify(match.groups)}` : ''}`).join('\n')}`;
    }

    function generateRegex(request) {
      const templates = {
        email: '/^[\\w.+-]+@[\\w.-]+\\.[A-Za-z]{2,}$/',
        url: '/^https?:\\/\\/[^\\s]+$/i',
        uuid: '/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i',
        ipv4: '/^(?:\\d{1,3}\\.){3}\\d{1,3}$/',
        date: '/^\\d{4}-\\d{2}-\\d{2}$/',
        hex: '/^#[0-9a-f]{6}$/i',
        phone: '/^\\+?[1-9]\\d{7,14}$/'
      };
      const key = request.trim().toLowerCase();
      const result = templates[key];
      if (!result) throw new Error(`Unknown template. Try: ${Object.keys(templates).join(', ')}`);
      return `Generated regex for ${key}\n\n${result}`;
    }

    function encodeBase64(value) {
      if (value.startsWith('decode:')) {
        const encoded = value.slice(7).trim();
        try {
          const bytes = Uint8Array.from(atob(encoded), char => char.charCodeAt(0));
          return new TextDecoder().decode(bytes);
        } catch {
          throw new Error('Invalid Base64 input');
        }
      }
      const bytes = new TextEncoder().encode(value);
      let binary = '';
      bytes.forEach(byte => { binary += String.fromCharCode(byte); });
      return btoa(binary);
    }

    function capitalize(s) {
      return s.charAt(0).toUpperCase() + s.slice(1);
    }

    ['input', 'keyup', 'paste', 'change'].forEach(evt => {
      inputEl.addEventListener(evt, handleConvert);
    });

    applySavedTheme();
    renderHistory();
    lucide.createIcons();
    loadSample();
  </script>
